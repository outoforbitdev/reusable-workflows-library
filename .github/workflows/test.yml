name: Test

permissions: {}
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest test_detect_changelog_version -v
        working-directory: src

  test-docker-workflow:
    name: Test Docker Workflow
    permissions:
      contents: read
    uses: ./.github/workflows/test-docker.yml
    with:
      dockerfile-path: test/docker-fixture
      test-command: echo docker-fixture-ok

  publish-docker-workflow-docker-hub-dry-run:
    name: Publish Docker Workflow (Docker Hub dry run)
    permissions:
      contents: read
    uses: ./.github/workflows/publish-docker.yml
    with:
      registry: docker-hub
      image-name: outoforbitdev/reusable-workflows-library-ci-fixture
      image-tag: ${{ github.sha }}
      dockerfile-path: test/docker-fixture
      dry-run: true
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}

  publish-docker-workflow-ghcr-dry-run:
    name: Publish Docker Workflow (GHCR dry run)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      registry: ghcr
      image-name: reusable-workflows-library-ci-fixture
      image-tag: ${{ github.sha }}
      dockerfile-path: test/docker-fixture
      dry-run: true
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
