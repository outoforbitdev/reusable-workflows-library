name: Test

permissions: {}
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
        working-directory: src

  test-docker-workflow:
    name: Test Docker Workflow
    permissions:
      contents: read
    uses: ./.github/workflows/test-docker.yml
    with:
      dockerfile-path: test/docker-fixture
      test-command: echo docker-fixture-ok

  publish-docker-workflow-docker-hub-dry-run:
    name: Publish Docker Workflow (Docker Hub dry run)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      registry: docker-hub
      image-name: outoforbitdev/reusable-workflows-library-ci-fixture
      image-tag: ${{ github.sha }}
      dockerfile-path: test/docker-fixture
      dry-run: true
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}

  publish-docker-workflow-ghcr-dry-run:
    name: Publish Docker Workflow (GHCR dry run)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      registry: ghcr
      image-name: reusable-workflows-library-ci-fixture
      image-tag: ${{ github.sha }}
      dockerfile-path: test/docker-fixture
      dry-run: true
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}

  send-discord-message-workflow-dry-run:
    name: Send Discord Message Workflow (dry run)
    permissions: {}
    uses: ./.github/workflows/send-discord-message.yml
    with:
      message: Dry run from ${{ github.repository }}
      username: CI
      embed-title: Dry run
      embed-description: Verifies the payload is built without sending it.
      embed-color: 2ea44f
      embed-footer: ${{ github.repository }}
      embed-timestamp: true
      embed-fields: '[{"name": "Commit", "value": "${{ github.sha }}", "inline": true}]'
      dry-run: true
    secrets:
      # A well-formed but fake URL; a dry run never contacts Discord.
      webhook-url: https://discord.com/api/webhooks/1/dry-run

  notify-discord-release-workflow-dry-run:
    name: Notify Discord of Release Workflow (dry run)
    permissions: {}
    uses: ./.github/workflows/notify-discord-release.yml
    with:
      version: 0.0.0
      release-url: https://github.com/${{ github.repository }}/releases
      release-notes: "### Added\n- A dry run release note."
      dry-run: true
    secrets:
      # A well-formed but fake URL; a dry run never contacts Discord.
      webhook-url: https://discord.com/api/webhooks/1/dry-run
