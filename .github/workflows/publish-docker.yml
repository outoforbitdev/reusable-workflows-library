name: Publish Docker

on:
  workflow_call:
    inputs:
      registry:
        description: "Which registry to publish to: 'docker-hub' or 'ghcr'"
        type: string
        required: true
      image-name:
        description: "The name (repository) of the image being published, without a registry-host prefix"
        type: string
        required: true
      image-tag:
        description: "The tag of the image being published"
        type: string
        required: true
      dockerfile-path:
        description: "Path to the directory with the Dockerfile"
        type: string
        default: "."
      platforms:
        description: "Comma-delimited list of target platforms"
        type: string
        default: "linux/amd64,linux/arm64/v8,linux/arm/v7"
      build-args:
        description: "List of build args in the form 'ARG_ONE=value,ARG_TWO=value'"
        type: string
        default: ""
      dry-run:
        description: "If true, build but do not push the image"
        type: boolean
        default: false
      publish-latest:
        description: "If true, also tag and push the image as 'latest'"
        type: boolean
        default: false
    secrets:
      docker-username:
        description: "Required when registry is 'docker-hub'"
        required: false
      docker-token:
        description: "Required when registry is 'docker-hub'"
        required: false
      registry-token:
        description: "Required when registry is 'ghcr' — pass secrets.GITHUB_TOKEN"
        required: false
    outputs:
      tag:
        description: "The tag that was published"
        value: ${{ jobs.publish.outputs.tag }}
      sha-tag:
        description: "The sha-specific tag that was published"
        value: ${{ jobs.publish.outputs.sha-tag }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish Docker
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.set-tags.outputs.short-tag }}
      sha-tag: ${{ steps.set-tags.outputs.sha-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate registry input
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          case "$REGISTRY" in
            docker-hub|ghcr) ;;
            *)
              echo "Unsupported registry '${REGISTRY}': expected 'docker-hub' or 'ghcr'" >&2
              exit 1
              ;;
          esac
        shell: bash
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: inputs.registry == 'docker-hub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-token }}
      - name: Log in to GitHub Container Registry
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token }}
      - name: Set tags
        id: set-tags
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          PUBLISH_LATEST: ${{ inputs.publish-latest }}
        run: |
          if [ "$REGISTRY" = "ghcr" ]; then
            image_ref="ghcr.io/${IMAGE_NAME}"
          else
            image_ref="${IMAGE_NAME}"
          fi

          short_tag="${image_ref}:${IMAGE_TAG}"
          sha_tag="${short_tag}--$(git rev-parse --short HEAD)"
          latest_tag="${image_ref}:latest"

          tag_list="${short_tag},${sha_tag}"
          if [ "$PUBLISH_LATEST" = "true" ]; then
            tag_list="${tag_list},${latest_tag}"
          fi

          echo "short-tag=${short_tag}" >> "$GITHUB_OUTPUT"
          echo "sha-tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "tag-list=${tag_list}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: ${{ inputs.build-args }}
          context: ${{ inputs.dockerfile-path }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.dry-run == false }}
          tags: ${{ steps.set-tags.outputs.tag-list }}
