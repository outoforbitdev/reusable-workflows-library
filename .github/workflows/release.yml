# Internal workflow: creates this repo's own releases. It is not callable from
# other repositories. Use publish-release.yml for reusable release creation.
name: Create Release
permissions: {}
on:
  push:
    branches:
      - main
      - beta
      - dev
      - staging
jobs:
  detect:
    permissions:
      contents: write
    uses: ./.github/workflows/detect-new-changelog-version.yml
  publish:
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.detect.outputs.new-version }}
      prerelease: ${{ needs.detect.outputs.is-prerelease == 'true' }}
      release-notes: ${{ needs.detect.outputs.release-notes }}
      draft: false
  notify:
    needs: [detect, publish]
    permissions: {}
    uses: ./.github/workflows/notify-discord-release.yml
    with:
      version: ${{ needs.detect.outputs.new-version }}
      release-url: ${{ needs.publish.outputs.release-url }}
      release-notes: ${{ needs.detect.outputs.release-notes }}
      prerelease: ${{ needs.detect.outputs.is-prerelease == 'true' }}
    secrets:
      webhook-url: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
