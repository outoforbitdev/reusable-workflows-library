# Internal workflow: creates this repo's own releases. It is not callable from
# other repositories. Use publish-release.yml for reusable release creation.
name: Create Release
permissions: {}
on:
  push:
    branches:
      - main
      - beta
      - dev
      - staging
jobs:
  detect:
    permissions:
      contents: write
    uses: ./.github/workflows/detect-new-changelog-version.yml
  publish:
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.detect.outputs.new-version }}
      prerelease: ${{ needs.detect.outputs.is-prerelease == 'true' }}
      release-notes: ${{ needs.detect.outputs.release-notes }}
      draft: false
  prepare-notification:
    needs: [detect, publish]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      description: ${{ steps.truncate.outputs.description }}
    steps:
      - name: Truncate release notes to fit a Discord embed
        id: truncate
        env:
          RELEASE_NOTES: ${{ needs.detect.outputs.release-notes }}
        run: |
          # Discord embed descriptions are limited to 4096 characters.
          description="$RELEASE_NOTES"
          if [ "${#description}" -gt 4000 ]; then
            description="${description:0:4000}"$'\n\n'"...see the release for the full notes."
          fi
          {
            echo "description<<EOF_NOTES"
            echo "$description"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
  notify:
    needs: [detect, publish, prepare-notification]
    permissions: {}
    uses: ./.github/workflows/send-discord-message.yml
    with:
      embed-title: v${{ needs.detect.outputs.new-version }} released
      embed-url: ${{ needs.publish.outputs.release-url }}
      embed-description: ${{ needs.prepare-notification.outputs.description }}
      embed-color: ${{ needs.detect.outputs.is-prerelease == 'true' && 'f0883e' || '2ea44f' }}
      embed-footer: ${{ github.repository }}
      embed-timestamp: true
    secrets:
      webhook-url: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
